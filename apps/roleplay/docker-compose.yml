# Nexo Treino na VPS (145.223.94.63) — convive com o DeskcommCRM.
# O proxy de lá é o CADDY do CRM (deskcommcrm-caddy-1), que ocupa 80/443 com SSL
# automático. Este container só entra na MESMA rede docker (deskcommcrm_internal),
# sem publicar porta no host; o roteamento é um bloco no Caddyfile do CRM:
#
#   treino.nexoialocal.com.br {
#       encode gzip
#       reverse_proxy nexo_treino:8787
#   }
#
# Subir:  docker compose -p nexo_treino up -d --build
# Recarregar o Caddy depois de editar o Caddyfile:
#   docker exec deskcommcrm-caddy-1 caddy reload --config /etc/caddy/Caddyfile

services:
  roleplay:
    build: .
    container_name: nexo_treino
    restart: unless-stopped
    env_file: .env
    networks: [crmnet]

networks:
  crmnet:
    external: true
    name: deskcommcrm_internal
